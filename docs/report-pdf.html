<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCM — Relatório</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0d1f3c;--accent:#0284c7;--ok:#16a34a;--warn:#d97706;--err:#dc2626;
  --bg:#f1f5f9;--sur:#fff;--brd:#dde3ed;--txt:#1e293b;--txt2:#475569;--txt3:#94a3b8
}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:13px}

/* ── Toolbar (apenas na tela, não imprime) ── */
.toolbar{background:var(--primary);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.toolbar h1{font-size:15px;font-weight:700;flex:1}
.btn{padding:8px 18px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.btn-print{background:#0284c7;color:#fff}
.btn-back{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);text-decoration:none;padding:8px 14px;border-radius:7px;font-size:13px}
.proj-sel{padding:7px 12px;border:1.5px solid rgba(255,255,255,.3);border-radius:7px;font-size:13px;background:rgba(255,255,255,.1);color:#fff;outline:none}
.proj-sel option{color:#1e293b;background:#fff}
#loading{text-align:center;padding:60px;color:var(--txt2);font-size:15px}

/* ── Documento A4 ── */
.doc{max-width:794px;margin:24px auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.page{padding:32px 40px;min-height:297mm;position:relative;page-break-after:always}
.page:last-child{page-break-after:auto}

/* ── Capa ── */
.cover{display:flex;flex-direction:column;justify-content:space-between;background:var(--primary);color:#fff;min-height:297mm}
.cover-top{padding:40px 40px 0}
.cover-logo{height:52px;background:#fff;padding:6px 12px;border-radius:8px;display:inline-block;margin-bottom:40px}
.cover-logo img{height:40px;display:block}
.cover-title{font-size:32px;font-weight:800;line-height:1.15;margin-bottom:12px}
.cover-sub{font-size:16px;opacity:.7;margin-bottom:4px}
.cover-meta{font-size:13px;opacity:.5;margin-top:32px}
.cover-divider{height:3px;background:linear-gradient(90deg,#0284c7,#6366f1,#10b981);margin:24px 0}
.cover-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}
.cover-kpi{background:rgba(255,255,255,.08);border-radius:10px;padding:16px;border:1px solid rgba(255,255,255,.1)}
.cover-kpi .val{font-size:26px;font-weight:700;color:#fff}
.cover-kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.6;margin-top:3px}
.cover-bottom{padding:32px 40px;border-top:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:flex-end}
.cover-bottom .gen{font-size:11px;opacity:.4}

/* ── Seções ── */
.section-title{font-size:16px;font-weight:700;color:var(--primary);border-bottom:3px solid var(--accent);padding-bottom:8px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.section-title span{font-size:18px}

/* ── KPI grid ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:var(--bg);border-radius:10px;padding:14px 16px;border-left:4px solid var(--accent)}
.kpi-card.ok{border-left-color:var(--ok)}.kpi-card.warn{border-left-color:var(--warn)}.kpi-card.err{border-left-color:var(--err)}
.kpi-card .val{font-size:22px;font-weight:700;color:var(--txt)}
.kpi-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--txt3);margin-top:2px}
.kpi-card .sub{font-size:11px;color:var(--txt2);margin-top:4px}

/* ── EVM cards ── */
.evm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.evm-card{background:var(--bg);border-radius:8px;padding:12px 14px;text-align:center}
.evm-card .ev-val{font-size:18px;font-weight:700}
.evm-card .ev-lbl{font-size:10px;text-transform:uppercase;color:var(--txt3);margin-top:2px}

/* ── Tabelas ── */
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px}
thead th{background:var(--primary);color:#fff;padding:8px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
tbody tr{border-bottom:1px solid var(--brd)}
tbody tr:nth-child(even){background:#f8fafc}
td{padding:7px 10px}
.badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600;white-space:nowrap}
.done{background:#dcfce7;color:#166534}.delayed{background:#fee2e2;color:#991b1b}
.at-risk{background:#fef9c3;color:#854d0e}.on-track{background:#dbeafe;color:#1e40af}

/* ── Progress bar ── */
.pbar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;min-width:60px;display:inline-block;vertical-align:middle}
.pfill{height:100%;border-radius:3px;background:var(--accent)}
.pfill.ok{background:var(--ok)}.pfill.err{background:var(--err)}.pfill.warn{background:var(--warn)}

/* ── Gantt simplificado ── */
.gantt-row{display:flex;align-items:center;gap:0;height:22px;border-bottom:1px solid #f1f5f9;font-size:11px}
.gantt-name{width:220px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;color:var(--txt2)}
.gantt-name.cat{color:var(--primary);font-weight:700;font-size:11px;text-transform:uppercase}
.gantt-bar-area{flex:1;position:relative;height:100%;overflow:hidden}
.g-bar{height:12px;border-radius:3px;position:absolute;top:5px}
.g-today{position:absolute;top:0;bottom:0;width:1px;background:#ef4444;z-index:2}

/* ── Gráficos ── */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.chart-box{background:var(--bg);border-radius:10px;padding:16px}
.chart-box h4{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.04em}

/* ── Footer das páginas ── */
.page-footer{position:absolute;bottom:20px;left:40px;right:40px;display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);border-top:1px solid var(--brd);padding-top:8px}

/* ── PRINT ── */
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  .toolbar{display:none!important}
  #loading{display:none!important}
  .doc{margin:0;box-shadow:none;max-width:100%}
  .page{padding:28px 36px;min-height:297mm}
  table{font-size:11px}
  td{padding:5px 8px}
  canvas{max-width:100%!important}
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}
</style>
</head>
<body>

<div class="toolbar">
  <a href="reports.html" class="btn-back" id="btn-back">← Relatórios</a>
  <select class="proj-sel" id="proj-sel" onchange="onProjChange(this.value)" style="min-width:200px">
    <option value="">— Selecione a obra —</option>
  </select>
  <!-- Seletor de tipo -->
  <div style="display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:3px;gap:2px">
    <button id="tipo-btn-sintetico" onclick="setTipo('sintetico')"
      style="padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;background:var(--primary-btn,rgba(255,255,255,.15));color:#fff;transition:background .2s">
      📋 Sintético
    </button>
    <button id="tipo-btn-analitico" onclick="setTipo('analitico')"
      style="padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.0);color:rgba(255,255,255,.6);transition:background .2s">
      🔍 Analítico
    </button>
  </div>
  <h1 id="toolbar-title" style="flex:1">Relatório</h1>
  <button class="btn btn-print" onclick="window.print()">🖨 Gerar PDF</button>
</div>

<div id="loading">Selecione uma obra para gerar o relatório.</div>

<div class="doc" id="doc" style="display:none"></div>

<script>
const{createClient}=supabase;
const sb=createClient('https://fkndewrridhgwwkrjmmc.supabase.co','sb_publishable_49gXUr0vbSdYLcHJXorglg_zVfhREcY');

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function brl(n){return'R$ '+(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2});}
function fmtD(d){if(!d)return'—';const[y,m,day]=d.split('-');return day+'/'+m+'/'+y;}
function pd(s){return new Date(s+'T00:00:00');}
function dif(a,b){return Math.round((b-a)/86400000);}
const MONTHS=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const COLORS=['#3b82f6','#8b5cf6','#10b981','#f59e0b','#ef4444','#06b6d4','#ec4899','#84cc16','#f97316','#6366f1'];
let charts={};
function mkChart(id,cfg){if(charts[id])charts[id].destroy();const c=new Chart(document.getElementById(id),cfg);charts[id]=c;return c;}

const _params=new URLSearchParams(location.search);
let currentPid=parseInt(_params.get('pid')||'0');
let currentTipo=_params.get('tipo')||'sintetico'; // 'sintetico' | 'analitico'

function applyTipoButtons(){
  const btnS=document.getElementById('tipo-btn-sintetico');
  const btnA=document.getElementById('tipo-btn-analitico');
  btnS.style.background=currentTipo==='sintetico'?'rgba(255,255,255,.25)':'rgba(255,255,255,0)';
  btnS.style.color=currentTipo==='sintetico'?'#fff':'rgba(255,255,255,.6)';
  btnA.style.background=currentTipo==='analitico'?'rgba(255,255,255,.25)':'rgba(255,255,255,0)';
  btnA.style.color=currentTipo==='analitico'?'#fff':'rgba(255,255,255,.6)';
}

function setTipo(tipo){
  currentTipo=tipo;
  applyTipoButtons();
  const u=new URL(location.href);
  u.searchParams.set('tipo',tipo);
  if(currentPid)u.searchParams.set('pid',currentPid);
  history.replaceState(null,'',u);
  if(currentPid) loadReport(currentPid);
}

function onProjChange(val){
  currentPid=parseInt(val)||0;
  const u=new URL(location.href);
  if(currentPid)u.searchParams.set('pid',currentPid);else u.searchParams.delete('pid');
  u.searchParams.set('tipo',currentTipo);
  history.replaceState(null,'',u);
  loadReport(currentPid);
}

async function init(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session){window.location.href='index.html';return;}
  const{data:projs}=await sb.from('projects').select('id,name').order('name');
  const sel=document.getElementById('proj-sel');
  (projs||[]).forEach(p=>sel.innerHTML+=`<option value="${p.id}">${esc(p.name)}</option>`);
  applyTipoButtons();
  if(currentPid){
    sel.value=String(currentPid); // garante string para match com value do option
    loadReport(currentPid);
  }
}

async function loadReport(pid){
  pid=parseInt(pid);
  if(!pid){document.getElementById('loading').innerHTML='Selecione uma obra para gerar o relatório.';document.getElementById('loading').style.display='';document.getElementById('doc').style.display='none';return;}
  document.getElementById('loading').innerHTML='⏳ Carregando dados...';
  document.getElementById('loading').style.display='';
  document.getElementById('doc').style.display='none';

  const[{data:proj},{data:tasks},{data:budgets},{data:miles},{data:teData},{data:tiData}]=await Promise.all([
    sb.from('projects').select('*').eq('id',pid).single(),
    sb.from('tasks').select('*').eq('project_id',pid).order('order_idx'),
    sb.from('budget_items').select('*,cost_categories(name,type)').eq('project_id',pid),
    sb.from('billing_milestones').select('*').eq('project_id',pid).order('due_date'),
    sb.from('task_employees').select('*,employees(id,name,role),tasks!inner(project_id)').eq('tasks.project_id',pid),
    sb.from('time_entries').select('*,employees(id,name),tasks!inner(project_id)').eq('tasks.project_id',pid).order('work_date')
  ]);

  if(!proj){document.getElementById('loading').innerHTML='Projeto não encontrado.';return;}

  const isSintetico=currentTipo==='sintetico';
  const tipoLabel=isSintetico?'Relatório Sintético':'Relatório Analítico';
  document.getElementById('loading').style.display='none';
  document.getElementById('toolbar-title').textContent=proj.name+' — '+tipoLabel;
  document.title='BCM — '+proj.name+' — '+tipoLabel;
  // Atualiza link de volta para relatórios com pid
  document.getElementById('btn-back').href='reports.html?pid='+pid;

  const today=new Date();today.setHours(0,0,0,0);
  const tList=tasks||[];
  const bList=budgets||[];
  const mList=miles||[];
  const teList=teData||[];
  const tiList=tiData||[];

  // ── Cálculos base ─────────────────────────────────────────
  const dates=tList.flatMap(t=>[pd(t.start_date),pd(t.end_date)]);
  const PS=dates.length?new Date(Math.min(...dates)):today;
  const PE=dates.length?new Date(Math.max(...dates)):today;
  const PTOT=Math.max(dif(PS,PE),1);
  const pctCrono=Math.min(100,Math.max(0,Math.round(dif(PS,today)/PTOT*100)));
  const done=tList.filter(t=>t.progress>=100).length;
  const delayed=tList.filter(t=>pd(t.end_date)<today&&t.progress<100).length;
  const inprog=tList.filter(t=>pd(t.start_date)<=today&&pd(t.end_date)>=today&&t.progress<100).length;
  const avgProg=tList.length?Math.round(tList.reduce((a,t)=>a+(+t.progress||0),0)/tList.length):0;
  const spi=pctCrono>0?+(avgProg/pctCrono).toFixed(2):1;

  // EVM
  const totalPrev=bList.reduce((a,b)=>a+(+b.planned_amount||0),0);
  const totalReal=bList.reduce((a,b)=>a+(+b.actual_amount||0),0);
  const totalFat=mList.filter(m=>m.paid).reduce((a,m)=>a+(+m.amount||0),0);
  const PV=totalPrev*(pctCrono/100);
  const EV=totalPrev*(avgProg/100);
  const AC=totalReal;
  const CV=EV-AC;
  const SV=EV-PV;
  const CPI=AC>0?+(EV/AC).toFixed(2):1;

  // Curva S semanal
  const weeks=[];const wc=new Date(PS);
  while(wc<=PE){weeks.push(new Date(wc));wc.setDate(wc.getDate()+7);}
  const crvPlanned=weeks.map(w=>Math.min(100,Math.round(dif(PS,w)/PTOT*100)));
  const crvActual=weeks.map(w=>{
    const past=tList.filter(t=>pd(t.start_date)<=w);
    return past.length?Math.round(past.reduce((a,t)=>a+(+t.progress||0),0)/tList.length):0;
  });

  // Horas
  const totalPH=teList.reduce((a,te)=>a+(+te.planned_hours||0),0);
  const totalAH=tiList.reduce((a,ti)=>a+(+ti.hours||0),0);
  const allocEmpIds=[...new Set(teList.map(te=>te.employees?.id).filter(Boolean))];

  const genDate=today.toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});

  // ── Gantt mini ────────────────────────────────────────────
  const cats=[...new Set(tList.map(t=>t.category))];
  const totalDays=PTOT;
  const todayX=Math.min(100,Math.max(0,dif(PS,today)/totalDays*100));
  const ganttRows=[];
  cats.forEach(cat=>{
    const ct=tList.filter(t=>t.category===cat);
    const ci=cats.indexOf(cat)%COLORS.length;
    ganttRows.push({type:'cat',cat,ci});
    ct.forEach(t=>ganttRows.push({type:'task',t,ci}));
  });

  function ganttBarHTML(t,ci){
    const bx=Math.max(0,dif(PS,pd(t.start_date))/totalDays*100);
    const bw=Math.max(0.5,dif(pd(t.start_date),pd(t.end_date))/totalDays*100);
    const fw=Math.round(t.progress/100*bw);
    return`<div class="g-bar" style="left:${bx}%;width:${bw}%;background:${COLORS[ci]}22;border:1px solid ${COLORS[ci]}66">
      <div style="height:100%;width:${fw/bw*100}%;background:${COLORS[ci]};border-radius:2px;opacity:.8"></div>
    </div>`;
  }

  // ── HTML ──────────────────────────────────────────────────
  const doc=document.getElementById('doc');
  doc.innerHTML=`

  <!-- CAPA -->
  <div class="page cover">
    <div class="cover-top">
      <div class="cover-logo"><img src="bcm-logo.jpg" alt="BCM"></div>
      <div style="font-size:12px;opacity:.5;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em">${tipoLabel} de Obra</div>
      <div class="cover-title">${esc(proj.name)}</div>
      <div class="cover-sub">${esc(proj.client||'')}</div>
      <div class="cover-sub" style="opacity:.5;font-size:12px">${esc(proj.location||'')}</div>
      <div class="cover-divider"></div>
      <div class="cover-kpis">
        <div class="cover-kpi"><div class="val">${tList.length}</div><div class="lbl">Tarefas</div></div>
        <div class="cover-kpi"><div class="val" style="color:#4ade80">${avgProg}%</div><div class="lbl">Progresso Geral</div></div>
        <div class="cover-kpi"><div class="val" style="color:${spi>=1?'#4ade80':'#f87171'}">${spi}</div><div class="lbl">SPI (Índice Prazo)</div></div>
        <div class="cover-kpi"><div class="val" style="color:${CPI>=1?'#4ade80':'#f87171'}">${CPI}</div><div class="lbl">CPI (Índice Custo)</div></div>
      </div>
      <div class="cover-meta">
        Período: ${fmtD(proj.start_date)} → ${fmtD(proj.end_date)} &nbsp;·&nbsp;
        Status: ${proj.status||'—'} &nbsp;·&nbsp;
        ${pctCrono}% do prazo decorrido
      </div>
    </div>
    <div class="cover-bottom">
      <div class="gen">Gerado em ${genDate}</div>
      <div class="gen">BCM Eletricidade e Automação</div>
    </div>
  </div>

  <!-- PÁG 2: KPIs + CURVA S -->
  <div class="page" style="page-break-before:always">
    <div class="section-title"><span>📊</span> Indicadores de Desempenho</div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="val">${tList.length}</div><div class="lbl">Total de Tarefas</div></div>
      <div class="kpi-card ok"><div class="val" style="color:var(--ok)">${done}</div><div class="lbl">Concluídas</div></div>
      <div class="kpi-card ${delayed>0?'err':'ok'}"><div class="val" style="color:${delayed>0?'var(--err)':'var(--ok)'}">${delayed}</div><div class="lbl">Atrasadas</div></div>
      <div class="kpi-card"><div class="val" style="color:var(--warn)">${inprog}</div><div class="lbl">Em Andamento</div></div>
      <div class="kpi-card"><div class="val">${avgProg}%</div><div class="lbl">Progresso Físico</div><div class="sub"><div class="pbar" style="width:80px"><div class="pfill ${avgProg>=pctCrono?'ok':'err'}" style="width:${avgProg}%"></div></div></div></div>
      <div class="kpi-card"><div class="val">${pctCrono}%</div><div class="lbl">% Prazo Decorrido</div></div>
      <div class="kpi-card ${spi>=1?'ok':'err'}"><div class="val" style="color:${spi>=1?'var(--ok)':'var(--err)'}">${spi}</div><div class="lbl">SPI — Índice de Prazo</div><div class="sub">${spi>=1?'✅ No prazo':'⚠️ Atrasado'}</div></div>
      <div class="kpi-card ${CPI>=1?'ok':'err'}"><div class="val" style="color:${CPI>=1?'var(--ok)':'var(--err)'}">${CPI}</div><div class="lbl">CPI — Índice de Custo</div><div class="sub">${CPI>=1?'✅ Dentro do orçamento':'⚠️ Acima do orçamento'}</div></div>
    </div>

    <div class="section-title" style="margin-top:20px"><span>📈</span> Curva S — Progresso Físico</div>
    <div class="chart-box" style="margin-bottom:20px">
      <canvas id="chart-curva" height="200"></canvas>
    </div>

    <div class="charts-row">
      <div class="chart-box">
        <h4>Progresso por Sistema</h4>
        <canvas id="chart-cats" height="200"></canvas>
      </div>
      <div class="chart-box">
        <h4>Distribuição de Status</h4>
        <canvas id="chart-status" height="200"></canvas>
      </div>
    </div>
    <div class="page-footer"><span>BCM Eletricidade e Automação · ${esc(proj.name)}</span><span>Gerado em ${genDate}</span></div>
  </div>

  <!-- PÁG 3: GANTT SIMPLIFICADO -->
  <div class="page" style="page-break-before:always">
    <div class="section-title"><span>📋</span> Cronograma — Visão Geral</div>
    <div style="font-size:10px;color:var(--txt3);margin-bottom:8px;display:flex;gap:16px">
      <span>Período: ${fmtD(PS.toISOString().split('T')[0])} → ${fmtD(PE.toISOString().split('T')[0])}</span>
      <span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:4px;background:#ef4444;display:inline-block"></span> Hoje</span>
    </div>
    <div style="position:relative;margin-bottom:8px">
      <!-- Header de meses -->
      <div style="display:flex;margin-left:220px;border-bottom:1px solid var(--brd);padding-bottom:3px">
        ${(()=>{
          let h='';const mc=new Date(PS);
          while(mc<=PE){
            const mEnd=new Date(mc.getFullYear(),mc.getMonth()+1,0);
            const s=new Date(Math.max(mc,PS)),e=new Date(Math.min(mEnd,PE));
            const pct=dif(s,e)/totalDays*100;
            h+=`<div style="width:${pct}%;flex:none;font-size:9px;font-weight:700;color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px">${MONTHS[mc.getMonth()]} ${mc.getFullYear()}</div>`;
            mc.setMonth(mc.getMonth()+1);mc.setDate(1);
          }
          return h;
        })()}
      </div>
      <!-- Linha de hoje -->
      <div style="position:absolute;left:calc(220px + ${todayX}%);top:0;bottom:0;width:1px;background:#ef4444;z-index:5;pointer-events:none"></div>
      <!-- Linhas de tarefa -->
      ${ganttRows.map(r=>{
        if(r.type==='cat'){
          return`<div class="gantt-row" style="background:#f1f5f9;height:20px">
            <div class="gantt-name cat" style="width:220px">${esc(r.cat)}</div>
            <div class="gantt-bar-area"></div>
          </div>`;
        }
        const{t,ci}=r;
        const st=pd(t.end_date)<today&&t.progress<100?'err':t.progress>=100?'ok':pd(t.start_date)<=today?'warn':'';
        return`<div class="gantt-row">
          <div class="gantt-name" style="width:220px;color:var(--txt2)" title="${esc(t.name)}">${esc(t.name.length>28?t.name.slice(0,27)+'…':t.name)}</div>
          <div class="gantt-bar-area" style="position:relative;flex:1;height:22px">${ganttBarHTML(t,ci)}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="page-footer"><span>BCM Eletricidade e Automação · ${esc(proj.name)}</span><span>Gerado em ${genDate}</span></div>
  </div>

  <!-- PÁG 4: FINANCEIRO (apenas Analítico) -->
  ${isSintetico?'':`<div class="page" style="page-break-before:always">
    <div class="section-title"><span>💰</span> Análise Financeira</div>`}
    <div class="evm-grid">
      <div class="evm-card"><div class="ev-val">${brl(totalPrev)}</div><div class="ev-lbl">Orçamento Total</div></div>
      <div class="evm-card"><div class="ev-val">${brl(PV)}</div><div class="ev-lbl">Valor Planejado (PV)</div></div>
      <div class="evm-card"><div class="ev-val">${brl(EV)}</div><div class="ev-lbl">Valor Agregado (EV)</div></div>
      <div class="evm-card"><div class="ev-val">${brl(AC)}</div><div class="ev-lbl">Custo Real (AC)</div></div>
      <div class="evm-card"><div class="ev-val" style="color:${CV>=0?'var(--ok)':'var(--err)'}">${brl(CV)}</div><div class="ev-lbl">Variação de Custo (CV)</div></div>
      <div class="evm-card"><div class="ev-val" style="color:${SV>=0?'var(--ok)':'var(--err)'}">${brl(SV)}</div><div class="ev-lbl">Variação de Prazo (SV)</div></div>
      <div class="evm-card"><div class="ev-val" style="color:${CPI>=1?'var(--ok)':'var(--err)'}">${CPI}</div><div class="ev-lbl">CPI (Efic. de Custo)</div></div>
      <div class="evm-card"><div class="ev-val" style="color:${spi>=1?'var(--ok)':'var(--err)'}">${spi}</div><div class="ev-lbl">SPI (Efic. de Prazo)</div></div>
      <div class="evm-card"><div class="ev-val" style="color:var(--ok)">${brl(totalFat)}</div><div class="ev-lbl">Total Faturado</div></div>
    </div>

    ${bList.length?`
    <div class="section-title" style="margin-top:16px"><span>📊</span> Orçamento por Categoria</div>
    <div class="chart-box" style="margin-bottom:16px">
      <canvas id="chart-fin" height="180"></canvas>
    </div>`:''}

    ${mList.length?`
    <div class="section-title"><span>📅</span> Marcos de Faturamento</div>
    <table>
      <thead><tr><th>Marco</th><th>Vencimento</th><th>Valor</th><th>Status</th></tr></thead>
      <tbody>${mList.map(m=>`<tr>
        <td style="font-weight:600">${esc(m.description||'—')}</td>
        <td>${fmtD(m.due_date)}</td>
        <td>${brl(m.amount)}</td>
        <td><span class="badge ${m.paid?'done':'on-track'}">${m.paid?'✅ Pago':'⏳ Pendente'}</span></td>
      </tr>`).join('')}</tbody>
    </table>`:''}

    <div class="page-footer"><span>BCM Eletricidade e Automação · ${esc(proj.name)}</span><span>Gerado em ${genDate}</span></div>
  </div>`}

  <!-- PÁG 4/5: TAREFAS + EQUIPE -->
  <div class="page" style="page-break-before:always">
    <div class="section-title"><span>📋</span> Análise de Tarefas</div>
    <table>
      <thead><tr><th>Sistema</th><th>Tarefa</th><th>Início</th><th>Término</th><th>Progresso</th><th>Status</th></tr></thead>
      <tbody>
        ${tList.map(t=>{
          const e=pd(t.end_date);
          let status='on-track',label='No Prazo';
          if(t.progress>=100){status='done';label='Concluída';}
          else if(e<today){status='delayed';label='Atrasada';}
          else if(e-today<7*86400000&&t.progress<50){status='at-risk';label='Em Risco';}
          return`<tr>
            <td style="font-size:10px;color:var(--txt3)">${esc(t.category)}</td>
            <td style="font-weight:500;max-width:160px">${esc(t.name)}</td>
            <td>${fmtD(t.start_date)}</td>
            <td>${fmtD(t.end_date)}</td>
            <td>
              <span style="font-weight:700;font-size:11px">${t.progress}%</span>
              <div class="pbar" style="width:50px"><div class="pfill ${status==='done'?'ok':status==='delayed'?'err':''}" style="width:${t.progress}%"></div></div>
            </td>
            <td><span class="badge ${status}">${label}</span></td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>

    ${(allocEmpIds.length||tiList.length)?`
    <div class="section-title" style="margin-top:20px"><span>👷</span> Equipe</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px">
      <div class="kpi-card"><div class="val">${allocEmpIds.length}</div><div class="lbl">Funcionários Alocados</div></div>
      <div class="kpi-card"><div class="val">${totalPH.toFixed(0)}h</div><div class="lbl">Horas Planejadas</div></div>
      <div class="kpi-card ok"><div class="val" style="color:var(--ok)">${totalAH.toFixed(1)}h</div><div class="lbl">Horas Realizadas</div></div>
    </div>
    ${(()=>{
      const empRows={};
      tiList.forEach(ti=>{const n=ti.employees?.name||'—';if(!empRows[n])empRows[n]=0;empRows[n]+=(+ti.hours||0);});
      const teByEmp={};
      teList.forEach(te=>{const n=te.employees?.name||'—';if(!teByEmp[n])teByEmp[n]=0;teByEmp[n]+=(+te.planned_hours||0);});
      const names=[...new Set([...Object.keys(empRows),...Object.keys(teByEmp)])].sort();
      if(!names.length)return'';
      return`<table>
        <thead><tr><th>Funcionário</th><th>H. Planejadas</th><th>H. Realizadas</th><th>% Execução</th></tr></thead>
        <tbody>${names.map(n=>{
          const ah=empRows[n]||0;const ph=teByEmp[n]||0;
          const pct=ph>0?Math.round(ah/ph*100):null;
          return`<tr>
            <td style="font-weight:600">${esc(n)}</td>
            <td>${ph>0?ph.toFixed(0)+'h':'—'}</td>
            <td style="color:var(--ok);font-weight:600">${ah.toFixed(1)}h</td>
            <td>${pct!==null?`<span style="font-weight:700;color:${pct>=100?'var(--ok)':'var(--warn)'}">${pct}%</span>`:'—'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
    })()}`:''}

    <div class="page-footer"><span>BCM Eletricidade e Automação · ${esc(proj.name)}</span><span>Gerado em ${genDate}</span></div>
  </div>
  `;

  document.getElementById('doc').style.display='';

  // ── Gráficos ──────────────────────────────────────────────
  const wLabels=weeks.map(w=>{const[,m,d]=w.toISOString().split('T')[0].split('-');return d+'/'+m;});
  mkChart('chart-curva',{type:'line',data:{labels:wLabels,datasets:[
    {label:'Planejado (%)',data:crvPlanned,borderColor:'#94a3b8',backgroundColor:'rgba(148,163,184,.1)',borderDash:[4,2],fill:true,tension:.3,pointRadius:0},
    {label:'Realizado (%)',data:crvActual,borderColor:'#0284c7',backgroundColor:'rgba(2,132,199,.1)',fill:true,tension:.3,pointRadius:0,borderWidth:2}
  ]},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{min:0,max:100,title:{display:true,text:'% Progresso'}}}}});

  const catAvg=cats.map(c=>{const ct=tList.filter(t=>t.category===c);return Math.round(ct.reduce((a,t)=>a+t.progress,0)/ct.length);});
  mkChart('chart-cats',{type:'bar',data:{labels:cats,datasets:[{data:catAvg,backgroundColor:cats.map((_,i)=>COLORS[i%COLORS.length]+'cc'),borderRadius:4}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{min:0,max:100,title:{display:true,text:'%'}}}}});

  const stCounts=[done,inprog,delayed,tList.length-done-inprog-delayed];
  mkChart('chart-status',{type:'doughnut',data:{labels:['Concluídas','Em Andamento','Atrasadas','Não Iniciadas'],datasets:[{data:stCounts,backgroundColor:['#16a34a','#d97706','#dc2626','#94a3b8'],borderWidth:2}]},options:{responsive:true,plugins:{legend:{position:'right'}}}});

  if(!isSintetico&&bList.length){
    const catNames=[...new Set(bList.map(b=>b.cost_categories?.name||'Outros'))];
    const catPrev=catNames.map(c=>bList.filter(b=>b.cost_categories?.name===c).reduce((a,b)=>a+(+b.planned_amount||0),0));
    const catReal=catNames.map(c=>bList.filter(b=>b.cost_categories?.name===c).reduce((a,b)=>a+(+b.actual_amount||0),0));
    mkChart('chart-fin',{type:'bar',data:{labels:catNames,datasets:[
      {label:'Previsto',data:catPrev,backgroundColor:'rgba(2,132,199,.7)',borderRadius:4},
      {label:'Realizado',data:catReal,backgroundColor:'rgba(22,163,74,.6)',borderRadius:4}
    ]},options:{responsive:true,plugins:{legend:{position:'top'}},scales:{y:{title:{display:true,text:'R$'}}}}});
  }
}

init();
</script>
</body>
</html>
